# Local Mac runtime override.
# Uses latest 9router base plus the deployed DeepSeek cache-telemetry patch.
services:
  9router:
    image: 9router:cachefix-deepseek-20260912
    ports:
      - "3000:20128"
    environment:
      SEARXNG_URL: http://host.docker.internal:8888/search
    volumes:
      - ./scripts:/app/local-scripts:ro
