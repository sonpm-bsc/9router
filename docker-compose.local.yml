# Local Mac runtime override.
# Uses the deployed v0.5.75 cache-telemetry overlay. This image is local-only;
# rebuild it from the documented upstream base before using on another host.
services:
  9router:
    image: 9router:cachefix-openrouter-session-20260913-v075-r5
    labels:
      org.opencontainers.image.title: "9router cache telemetry + OpenRouter session overlay"
      org.opencontainers.image.version: "0.5.75"
      org.opencontainers.image.base.name: "upstream:v0.5.75"
      com.9router.source.ref: "main"
    ports:
      - "3000:20128"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch("http://127.0.0.1:20128/api/health").then((response) => {
          if (!response.ok) process.exitCode = 1;
          }).catch(() => { process.exitCode = 1; });
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    environment:
      SEARXNG_URL: http://host.docker.internal:8888/search
    volumes:
      - ./scripts:/app/local-scripts:ro
