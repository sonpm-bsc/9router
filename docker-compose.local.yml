# Local Mac runtime override.
# Live since 2026-10-20: upstream-merge-v0.5.104 (upstream-merge-v0.5.81 = rollback). ALWAYS pass both -f files. This image is local-only;
# rebuild it from the documented upstream base before using on another host.
services:
  9router:
    image: 9router:upstream-merge-v0.5.104
    labels:
      org.opencontainers.image.title: "9router cache telemetry + OpenRouter session overlay"
      org.opencontainers.image.version: "0.5.104"
      org.opencontainers.image.base.name: "upstream:v0.5.104"
      com.9router.source.ref: "main"
    ports:
      - "3000:20128"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch("http://127.0.0.1:20128/api/health").then((response) => {
          if (!response.ok) process.exitCode = 1;
          }).catch(() => { process.exitCode = 1; });
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    environment:
      SEARXNG_URL: http://host.docker.internal:8888/search
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 1.0
    volumes:
      - ./scripts:/app/local-scripts:ro
